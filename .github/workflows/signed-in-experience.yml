name: Signed-in Experience

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'docs/market-world/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/signed-in-experience.yml'

jobs:
  signed-in-experience:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: SecurePay-wide signed-in guard
        run: npm run check:signed-in-experience
      - name: Intelligent journey guard
        run: npm run check:intelligent-journey
      - name: Store owner guard
        run: npm run check:store-owner
      - name: Store sharing guard
        run: npm run check:store-share
      - name: Plug / Builder guard
        run: npm run check:plug
      - name: Community privacy guard
        run: npm run check:community
      - name: Circle guard
        run: npm run check:circle
      - name: Opportunity guard
        run: npm run check:opportunity
      - name: Master guard
        run: npm run check:master
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
